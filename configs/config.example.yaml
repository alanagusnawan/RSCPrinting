mode: agent  # agent | standalone

server:
  host: 127.0.0.1  # 127.0.0.1 untuk production; 0.0.0.0 hanya untuk debugging LAN
  port: 8080
  enable_local_print_endpoint: false  # aktifkan hanya untuk standalone / testing

ws_server:
  url: ""  # kosong = baca dari ./data/config atau env PRINT_AGENT_WS_URL (default: ws://localhost:5488/agent/ws)
  token: ""  # kosong = generate otomatis dan simpan di ./data/config atau env PRINT_AGENT_WS_TOKEN
  reconnectBackoffMax: 60s
  handshakeTimeout: 15s
  pingInterval: 30s
  welcomeTimeout: 10s

agent:
  id: ""              # UUID, generate otomatis jika kosong (disimpan di ./data/config)
  displayName: ""     # "Kasir Depan" dsb.

printers:
  defaultName: ""
  allowlist: []
  pollInterval: 5m    # deteksi perubahan daftar printer
  # Printer ESC/POS (thermal struk) dirender ke raster ESC/POS, melewati driver OS
  # sehingga menghindari output rusak (EJL/ESC/P-R) dari driver class/v4.
  thermal: []
  # thermal:
  #   - name: "Thermal"   # cocokkan persis nama queue di OS
  #     widthMm: 80        # 58 | 80
  #     dpi: 203
  #     cut: true          # auto-cut di akhir
  #     trim: true         # pangkas margin putih (default true)
  #     feed: 100          # feed (dot) sebelum cut (default 100 ≈ 18.75mm)

ghostscript:
  path: ""  # kosong = auto-detect (Windows)

office:
  enabled: true   # konversi dokumen Office (docx/xlsx/pptx) via LibreOffice headless
  path: ""        # kosong = auto-detect soffice/soffice.exe

document:
  allowRaw: true  # izinkan pengiriman byte mentah (ESC/POS, PCL, ZPL) langsung ke printer
  convertTimeout: 60s  # timeout konversi Office

logging:
  level: info
  format: json
  file: ""

queue:
  maxSizePerPrinter: 10
  jobTimeout: 60s
  maxConcurrentPerPrinter: 1

updater:
  enabled: false
  owner: ""
  repo: ""
  token: ""
  checkInterval: 6h
  prerelease: false

tray:
  enabled: true
  startMinimized: true

# Provisioning driver (dipakai scripts/install.ps1 & deploy-printers.ps1).
# Nilai ini menjadi default CLI; parameter skrip menimpanya.
provision:
  driverSource: "local"           # github | url | local
  apdDir: "dist"                   # folder installer APD lokal (relatif ke root repo)
  assetPattern: "*APD*.exe"        # pola nama file installer
  githubRepo: "alanagusnawan/RSCPrinting"
  githubTag: "drivers"             # tag rilis berisi aset driver (bila driverSource=github)
  url: ""                          # bila driverSource=url (mis. URL Epson)
  sha256: ""                       # opsional, verifikasi unduhan
  thermalDriverPattern: "*TM-T82*" # pola nama driver APD terpasang
