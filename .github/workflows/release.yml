name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Paksa jenis bump (kosong = dari conventional commits)"
        required: false
        default: ""
        type: choice
        options: ["", patch, minor, major]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.20"

      - name: Compute next version
        id: ver
        run: |
          set -euo pipefail
          latest=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n1 || true)
          if [ -z "$latest" ]; then
            next="v0.1.0"
            range=""
          else
            base="${latest#v}"
            MA=${base%%.*}; rest="${base#*.}"; MI=${rest%%.*}; PA=${rest#*.}
            range="${latest}..HEAD"
            forced='${{ github.event.inputs.bump }}'
            if [ -n "$forced" ]; then
              case "$forced" in
                major) MA=$((MA+1)); MI=0; PA=0 ;;
                minor) MI=$((MI+1)); PA=0 ;;
                *)     PA=$((PA+1)) ;;
              esac
            else
              full=$(git log --format=%B "$range" 2>/dev/null || true)
              subjects=$(git log --format=%s "$range" 2>/dev/null || true)
              if echo "$full" | grep -qiE 'BREAKING CHANGE' || echo "$full" | grep -qE '(^|[a-zA-Z]+(\(.+\))?)!:'; then
                MA=$((MA+1)); MI=0; PA=0
              elif echo "$subjects" | grep -qiE '^feat(\(.+\))?:'; then
                MI=$((MI+1)); PA=0
              else
                PA=$((PA+1))
              fi
            fi
            next="v${MA}.${MI}.${PA}"
          fi

          # Lewati bila tidak ada commit baru sejak tag terakhir.
          skip="false"
          if [ -n "$range" ] && [ -z "$(git log --oneline "$range" 2>/dev/null || true)" ]; then
            skip="true"
          fi
          if git rev-parse -q --verify "refs/tags/${next}" >/dev/null 2>&1; then
            skip="true"
          fi

          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "semver=${next#v}" >> "$GITHUB_OUTPUT"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "Next release: $next (skip=$skip)"

      - name: Build binaries
        if: steps.ver.outputs.skip != 'true'
        env:
          SEMVER: ${{ steps.ver.outputs.semver }}
        run: |
          set -euo pipefail
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          PKG=github.com/rscprinting/print-agent/internal/version
          LDFLAGS="-s -w -X ${PKG}.Version=${SEMVER} -X ${PKG}.GitCommit=${COMMIT} -X ${PKG}.BuildDate=${DATE}"
          mkdir -p out

          build() {
            local goos=$1 goarch=$2 name=$3
            local tags=()
            # Windows pakai tray; Linux/macOS headless (tanpa cgo).
            if [ "${goos}" != "windows" ]; then tags=(-tags headless); fi
            echo "Building ${name} (${goos}/${goarch})..."
            GOOS="${goos}" GOARCH="${goarch}" CGO_ENABLED=0 \
              go build "${tags[@]}" -ldflags "${LDFLAGS}" -o "out/${name}" ./cmd/print-agent
          }

          build windows amd64 print-agent-windows-amd64.exe
          build windows 386   print-agent-windows-386.exe
          build linux   amd64 print-agent-linux-amd64
          build linux   arm64 print-agent-linux-arm64
          build darwin  amd64 print-agent-darwin-amd64
          build darwin  arm64 print-agent-darwin-arm64

          (cd out && sha256sum print-agent-* > checksums.txt)
          echo "--- checksums.txt ---"
          cat out/checksums.txt

      - name: Verify tests
        if: steps.ver.outputs.skip != 'true'
        run: go test ./...

      - name: Create GitHub Release
        if: steps.ver.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            out/print-agent-windows-amd64.exe
            out/print-agent-windows-386.exe
            out/print-agent-linux-amd64
            out/print-agent-linux-arm64
            out/print-agent-darwin-amd64
            out/print-agent-darwin-arm64
            out/checksums.txt
